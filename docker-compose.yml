# Dev-окружение (локальная разработка). Production — docker-compose.prod.yml (Phase 9).
services:
  postgres:
    image: postgres:16-alpine
    container_name: volleytime_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: volleytime_dev
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 10

  # Redis НЕ используется: очередь задач на pg-boss (Postgres), см. Phase 15.
  # Оставлен закомментированным на случай смены решения по job runner.
  # redis:
  #   image: redis:7-alpine
  #   ...

volumes:
  postgres_data:
    driver: local
