<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<link rel="icon" type="image/svg+xml" href="assets/logo/vt-favicon.svg">
<title>VolleyTime · Публичные страницы</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Golos+Text:wght@400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="styles.css?v=surf1">

<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden;
    font-family:'Golos Text', system-ui, sans-serif; background:#ECEBEF;
  }
</style>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="atoms.jsx?v=surf1"></script>
<script type="text/babel" src="prototype-shell.jsx?v=surf1"></script>
<script type="text/babel" src="screens-public.jsx?v=surf1"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel" data-presets="env,react">
const MODE_KEY = 'vt-public-mode';
function App() {
  const [mode, setMode] = React.useState(() => localStorage.getItem(MODE_KEY) || 'fixed');
  React.useEffect(() => { localStorage.setItem(MODE_KEY, mode); }, [mode]);
  const sceneLeft = (
    <Segmented value={mode} onChange={setMode} options={[
      { value:'fixed', label:'Фиксированная цена' },
      { value:'split', label:'Делим сумму' },
      { value:'split-closed', label:'Сумма распределена' },
    ]}/>
  );
  return (
    <DesktopPrototype width={1280} height={820} frameCls="vt-frame" sceneLeft={sceneLeft}>
      <PublicEvent key={mode} mode={mode}/>
    </DesktopPrototype>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
