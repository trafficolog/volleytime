<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<link rel="icon" type="image/svg+xml" href="assets/logo/vt-favicon.svg">
<title>VolleyTime · Кабинет организатора</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Golos+Text:wght@400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="styles.css?v=surf1">

<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden;
    font-family:'Golos Text', system-ui, sans-serif; background:#ECEBEF;
  }
</style>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="tweaks-panel.jsx?v=surf1"></script>
<script type="text/babel" src="app-nav.jsx?v=surf1"></script>
<script type="text/babel" src="atoms.jsx?v=join1"></script>
<script type="text/babel" src="prototype-shell.jsx?v=surf1"></script>
<script type="text/babel" src="screens-web.jsx?v=rshot2"></script>
<script type="text/babel" src="screens-team.jsx?v=1"></script>
<script type="text/babel" src="screens-web-more.jsx?v=1"></script>
<script type="text/babel" src="screens-event-staff.jsx?v=1"></script>
<script type="text/babel" src="screens-schedule.jsx?v=surf1"></script>
<script type="text/babel" src="screens-web-forms.jsx?v=staff1"></script>
<script type="text/babel" src="screens-contributions.jsx?v=surf1"></script>
<script type="text/babel" src="screens-seo-page.jsx?v=4"></script>
<script type="text/babel" src="screens-seo.jsx?v=6"></script>
<script type="text/babel" src="screens-moderation.jsx?v=3"></script>
<script type="text/babel" src="screens-support.jsx?v=1"></script>
</head>
<body>
<style>@keyframes vtSearchIn{from{opacity:0;transform:translateX(12px)}to{opacity:1;transform:none}}@media (prefers-reduced-motion:reduce){@keyframes vtSearchIn{from{opacity:0}to{opacity:1}}}</style>
<div id="root"></div>

<script type="text/babel" data-presets="env,react">
const { useEffect } = React;

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "dark": false,
  "density": "compact",
  "accent": "#2437C9",
  "role": "player",
  "moderation": "none",
  "cabRole": "owner"
}/*EDITMODE-END*/;

const ACCENTS = ["#2437C9", "#1F2E96", "#FF6B1F", "#15161A", "#456F34"];

const SCREENS = {
  dashboard:      () => <WebDashboard/>,
  events:         () => <WebEvents/>,
  'event-detail': () => <WebEventDetail/>,
  'event-create': () => <WebEventCreate/>,
  members:        () => <WebMembers/>,
  plans:          () => <WebPlans/>,
  'plan-create':  () => <WebPlanCreate/>,
  ledger:         () => <WebLedger/>,
  'ledger-entry': () => <WebLedgerEntry/>,
  contributions:  () => <WebContributions/>,
  'contrib-create': () => <WebContribCreate/>,
  reports:        () => <WebReports/>,
  'reports-export': () => <WebReportsExport/>,
  notifications:  () => <WebNotifications/>,
  billing:        () => (cabIsOrganizer() ? <WebNoAccess/> : <WebBilling/>),
  settings:       () => <WebSettings/>,
  seo:            () => <WebSeoBuilder/>,
  'seo-preview':  () => <WebSeoPreview/>,
  support:        () => <WebSupport/>,
  'support-new':  () => <WebSupport/>,
};

function InnerApp({ initial = 'dashboard' }) {
  const { ctx, sheet, popover, toast, alertCfg } = useNavState(initial);
  const Screen = SCREENS[ctx.current] || SCREENS.dashboard;
  React.useEffect(() => { window.__nav = ctx; }, [ctx.current, ctx.data]);
  return (
    <NavContext.Provider value={ctx}>
      <Screen />
      <NavOverlays sheet={sheet} popover={popover} toast={toast} alertCfg={alertCfg} ctx={ctx}/>
    </NavContext.Provider>
  );
}

function App() {
  const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
  useEffect(() => { document.documentElement.style.setProperty('--vt-flame', t.accent); }, [t.accent]);
  const frameCls = ["vt-frame", t.dark ? "vt-dark" : "vt-light", t.density === "compact" ? "vt-dense" : ""].filter(Boolean).join(" ");
  // 24.1.3 · R-06: состояние модерации страницы группы (решение root)
  window.VT_SEO_MOD = t.moderation || 'none';
  // P-18: кто вошёл в кабинет — владелец или организатор
  window.VT_CAB_ROLE = t.cabRole || 'owner';

  const sceneLeft = (
    <Segmented value={t.cabRole || 'owner'} onChange={(v) => setTweak('cabRole', v)}
      options={[{value:'owner', label:'Владелец'}, {value:'organizer', label:'Организатор'}]}/>
  );

  return (
    <>
      <DesktopPrototype width={1440} height={900} frameCls={frameCls} sceneLeft={sceneLeft}>
        <InnerApp key={window.VT_SEO_MOD + window.VT_CAB_ROLE} initial={window.VT_SEO_MOD !== 'none' ? 'seo' : 'dashboard'}/>
      </DesktopPrototype>

      <TweaksPanel title="Tweaks · Кабинет">
        <TweakSection label="Кто вошёл · P-18" />
        <TweakRadio label="Роль" value={t.cabRole || 'owner'} options={[{value:'owner', label:'владелец'}, {value:'organizer', label:'организатор'}]} onChange={(v) => setTweak('cabRole', v)} />
        <TweakSection label="Страница группы · модерация" />
        <TweakRadio label="Решение root" value={t.moderation || 'none'} options={[{value:'none', label:'нет'}, {value:'hidden', label:'скрыта'}, {value:'noindex', label:'noindex'}]} onChange={(v) => setTweak('moderation', v)} />
        <TweakSection label="Тема" />
        <TweakToggle label="Тёмная" value={t.dark} onChange={(v) => setTweak('dark', v)} />
        <TweakRadio label="Плотность" value={t.density} options={['compact','regular']} onChange={(v) => setTweak('density', v)} />
        <TweakSection label="Акцент" />
        <TweakColor label="Primary" value={t.accent} options={ACCENTS} onChange={(v) => setTweak('accent', v)} />
        <TweakSection label="Подсказка" />
        <div style={{fontSize:11, color:'rgba(41,38,27,0.6)', lineHeight:1.4, padding:'2px 2px'}}>
          Полноценный кабинет: создание событий, календарь, касса с формами, сборы, отчёты, все разделы настроек. Сверху выберите, кто вошёл: организатор не видит баланс событий, роли команды и опасную зону.
        </div>
      </TweaksPanel>
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
