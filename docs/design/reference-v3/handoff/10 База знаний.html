<style>

    font-family:'Golos Text', system-ui, sans-serif; background:#ECEBEF;
  }
</style>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>

<script type="text/babel" src="app-nav.jsx?v=surf1"></script>
<script type="text/babel" src="atoms.jsx?v=surf1"></script>

</head>
<body>
<div id="root"></div>

<script type="text/babel" data-presets="env,react">
// help.volleytime.by — база знаний для игроков, тренеров и организаторов с формой обращения в поддержку
function App() {
  const [v, setV] = React.useState('home');
  const sceneLeft = (
    <Segmented value={v} onChange={setV} options={[
      { value:'home', label:'Главная' },
      { value:'section', label:'Раздел' },
      { value:'article', label:'Статья' },
      { value:'search', label:'Поиск' },
      { value:'contact', label:'Написать в поддержку' },
    ]}/>
  );
  return (
    <DesktopPrototype width={1280} height={820} frameCls="vt-frame" sceneLeft={sceneLeft} sceneRight={<span style={{fontSize:12, color:'#5B5C64', fontFamily:'Golos Text'}}>help.volleytime.by</span>}>
      <KbApp key={v} initial={v}/>
    </DesktopPrototype>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
