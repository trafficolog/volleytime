name: VPS disk monitor

# Task 9.8.18: read-only free-space check of the production VPS. A low disk or
# an unreachable VPS fails the run, so GitHub notifies the owner about the
# failed scheduled workflow. A Telegram alert through the existing bot is sent
# only when the repository variable OPS_ALERT_TELEGRAM_CHAT_ID is set.
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vps-disk-monitor
  cancel-in-progress: false

jobs:
  disk:
    name: Check VPS free disk space
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Configure SSH to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: bash scripts/configure-vps-ssh.sh

      - name: Read VPS disk usage
        id: vps_disk
        run: |
          set -euo pipefail
          df_output="$(timeout 1m ssh -n vps "$REMOTE_SCRIPT")"
          printf '%s\n' "$df_output"
          { echo 'stdout<<VPS_DF_EOF'; printf '%s\n' "$df_output"; echo 'VPS_DF_EOF'; } >> "$GITHUB_OUTPUT"
        env:
          REMOTE_SCRIPT: |
            df -Pk /opt/volleytime
            df -Pk "$(docker info --format '{{.DockerRootDir}}')" || true

      - name: Evaluate free space
        env:
          DF_OUTPUT: ${{ steps.vps_disk.outputs.stdout }}
        run: printf '%s\n' "$DF_OUTPUT" | bash scripts/disk-status.sh --fail-on-low

      - name: Alert owner in Telegram
        if: ${{ failure() && vars.OPS_ALERT_TELEGRAM_CHAT_ID != '' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ vars.OPS_ALERT_TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 20 --output /dev/null \
            --data-urlencode "chat_id=${CHAT_ID}" \
            --data-urlencode "text=Volley Time: проверка свободного места на VPS не прошла (мало места или VPS недоступен). ${RUN_URL}" \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage"
