name: Temporary SDD Formatter

on:
  push:
    branches:
      - docs/sdd-reconciliation-v0.1.3

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/sdd-reconciliation-v0.1.3
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format and self-remove
        run: |
          pnpm exec prettier --write .
          git rm .github/workflows/format-sdd-reconciliation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style: format SDD reconciliation"
          git push origin HEAD:docs/sdd-reconciliation-v0.1.3
