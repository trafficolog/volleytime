name: Deploy

on:
  push:
    branches: [prod]
  workflow_dispatch:
    inputs:
      deployment_mode:
        description: Deployment path
        required: true
        default: local-build
        type: choice
        options:
          - ghcr
          - local-build

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  NODE_VERSION: '22'
  REGISTRY: ghcr.io

jobs:
  source-gate:
    name: Verify production source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require prod branch
        run: node scripts/require-prod-ref.mjs

  test:
    name: Test before deploy
    needs: source-gate
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: volleytime_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/volleytime_test
      DATABASE_URL_TEST: postgresql://postgres:postgres@localhost:5432/volleytime_test
      TELEGRAM_BOT_TOKEN: '123456:CI'
      BETTER_AUTH_SECRET: ci-secret-at-least-32-chars-long-xx
      BETTER_AUTH_URL: http://localhost:3000
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'pnpm' }
      - run: pnpm install --frozen-lockfile
      - run: pnpm -F @volley-time/db db:migrate
      - run: pnpm test
      - run: pnpm lint
      - run: pnpm typecheck

  build-and-push:
    name: Build & push images
    needs: test
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.deployment_mode == 'ghcr' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & push web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/web:latest
            ghcr.io/${{ github.repository }}/web:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build & push migrator
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/migrator.Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/migrator:latest
            ghcr.io/${{ github.repository }}/migrator:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build & push bot
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/bot/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/bot:latest
            ghcr.io/${{ github.repository }}/bot:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to VPS
    needs: [test, build-and-push]
    if: ${{ always() && needs.test.result == 'success' && (needs.build-and-push.result == 'success' || needs.build-and-push.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Create release bundle
        run: git bundle create release.bundle HEAD
      - name: Prepare production env
        env:
          DOMAIN: ${{ secrets.DOMAIN }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_BOT_USERNAME: ${{ secrets.TELEGRAM_BOT_USERNAME }}
          WEBHOOK_SECRET_PATH: ${{ secrets.WEBHOOK_SECRET_PATH }}
          WEBHOOK_SECRET_TOKEN: ${{ secrets.WEBHOOK_SECRET_TOKEN }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          BETTER_AUTH_URL: ${{ secrets.BETTER_AUTH_URL }}
          BOT_INTERNAL_SECRET: ${{ secrets.BOT_INTERNAL_SECRET }}
          WEB_URL: ${{ secrets.WEB_URL }}
          SENTRY_DSN_WEB: ${{ secrets.SENTRY_DSN_WEB }}
          SENTRY_DSN_BOT: ${{ secrets.SENTRY_DSN_BOT }}
          S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          SMOKE_TG_ID: ${{ secrets.SMOKE_TG_ID }}
          BACKUP_AGE_RECIPIENT: ${{ secrets.BACKUP_AGE_RECIPIENT }}
          HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL }}
        run: node scripts/render-production-env.mjs .env.production
      - name: Prepare remote secret staging
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: deploy
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -euo pipefail
            install -d -m 700 /opt/volleytime/.deploy
            rm -f /opt/volleytime/.deploy/.env.production
            rm -f /opt/volleytime/.deploy/release.bundle
            rm -rf /opt/volleytime/.deploy/scripts
      - name: Upload production env
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: deploy
          key: ${{ secrets.VPS_SSH_KEY }}
          source: '.env.production,release.bundle,scripts/release-bundle.mjs,scripts/deploy-local-build.sh,scripts/backup-local.sh'
          target: '/opt/volleytime/.deploy'
      - name: Deploy GHCR images over SSH
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.deployment_mode == 'ghcr' }}
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: deploy
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -euo pipefail
            cd /opt/volleytime
            test -f .deploy/.env.production
            install -m 600 .deploy/.env.production .env
            rm -f .deploy/.env.production
            bash .deploy/scripts/backup-local.sh
            candidate_manifest=.deploy/.env.images.candidate
            {
              echo "WEB_IMAGE=ghcr.io/${{ github.repository }}/web:${{ github.sha }}"
              echo "BOT_IMAGE=ghcr.io/${{ github.repository }}/bot:${{ github.sha }}"
              echo "MIGRATOR_IMAGE=ghcr.io/${{ github.repository }}/migrator:${{ github.sha }}"
              echo "RELEASE_VERSION=${{ github.sha }}"
            } > "$candidate_manifest"
            chmod 600 "$candidate_manifest"
            # A same-SHA redeploy must retain the real previous release manifest.
            if [ -f .env.images ] && ! cmp -s .env.images "$candidate_manifest"; then
              cp -f .env.images .env.images.previous
              chmod 600 .env.images.previous
            fi
            install -m 600 "$candidate_manifest" .env.images
            rm -f -- "$candidate_manifest"
            docker compose -f docker-compose.prod.yml --env-file .env --env-file .env.images pull
            # миграции ОТДЕЛЬНОЙ стадией: ошибка останавливает деплой (Task 9.9.4)
            docker compose -f docker-compose.prod.yml --env-file .env --env-file .env.images \
              run --rm migrate
            docker compose -f docker-compose.prod.yml --env-file .env --env-file .env.images up -d
            docker image prune -f

      - name: Deploy verified bundle over SSH
        if: ${{ github.event_name == 'push' || inputs.deployment_mode == 'local-build' }}
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: deploy
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -euo pipefail
            cd /opt/volleytime
            test -f .deploy/.env.production
            test -f .deploy/scripts/deploy-local-build.sh
            install -m 600 .deploy/.env.production .env
            rm -f .deploy/.env.production
            bash .deploy/scripts/deploy-local-build.sh deploy-bundle .deploy/release.bundle ${{ github.sha }}

      - name: Smoke check
        id: smoke
        env:
          BASE_URL: https://${{ secrets.DOMAIN }}
          SMOKE_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          SMOKE_TG_ID: ${{ secrets.SMOKE_TG_ID }}
          WEBHOOK_SECRET_PATH: ${{ secrets.WEBHOOK_SECRET_PATH }}
          BOT_INTERNAL_SECRET: ${{ secrets.BOT_INTERNAL_SECRET }}
          EXPECTED_RELEASE: ${{ github.sha }}
        run: |
          sleep 15
          node scripts/smoke.mjs

      - name: Rollback GHCR images on failed smoke
        if: ${{ failure() && steps.smoke.outcome == 'failure' && github.event_name == 'workflow_dispatch' && inputs.deployment_mode == 'ghcr' }}
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: deploy
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -euo pipefail
            cd /opt/volleytime
            if [ ! -f .env.images.previous ]; then
              echo "нет записи о предыдущих образах — откат невозможен, нужен ручной разбор" && exit 1
            fi
            if cmp -s .env.images.previous .env.images; then
              echo "предыдущие образы совпадают с текущими — откатывать нечего, нужен ручной разбор" && exit 1
            fi
            cp -f .env.images.previous .env.images
            docker compose -f docker-compose.prod.yml --env-file .env --env-file .env.images up -d
            echo "rolled back to previous images:"
            cat .env.images

      - name: Rollback local build on failed smoke
        if: ${{ failure() && steps.smoke.outcome == 'failure' && (github.event_name == 'push' || inputs.deployment_mode == 'local-build') }}
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: deploy
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -euo pipefail
            cd /opt/volleytime
            test -f .deploy/scripts/deploy-local-build.sh
            bash .deploy/scripts/deploy-local-build.sh rollback
