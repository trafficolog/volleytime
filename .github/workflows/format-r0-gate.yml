name: Temporary R0 Gate Formatter

on:
  push:
    branches:
      - task/9.8.3-fallback-rollback

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: task/9.8.3-fallback-rollback
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format R0 gate report and self-remove
        run: |
          pnpm exec prettier --write docs/operations/reviews/2026-09-18-r0-mvp-gate.md
          git rm .github/workflows/format-r0-gate.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style: format R0 MVP gate report"
          git push origin HEAD:task/9.8.3-fallback-rollback
